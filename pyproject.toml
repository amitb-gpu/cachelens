[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cachelens"
version = "0.1.0"
description = "A profiler for LLM prompt-cache economics: find the bytes that broke your prefix, and what they cost."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Amit Brahmbhatt" }]
keywords = ["llm", "prompt-caching", "agents", "observability", "profiler", "finops"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
report = ["jinja2>=3"]

[project.scripts]
cachelens = "cachelens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
